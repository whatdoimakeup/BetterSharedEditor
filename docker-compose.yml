services:
  tarantool:
    image: tarantool/tarantool:2.11
    container_name: bse-tarantool
    ports:
      - "3301:3301"
    volumes:
      - ./tarantool:/opt/tarantool
      - tarantool_data:/var/lib/tarantool
    command: tarantool /opt/tarantool/init.lua

  redis:
    image: redis:7-alpine
    container_name: bse-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: bse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"


  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: bse-centrifugo
    ports:
      - "8001:8000"
    volumes:
      - ./centrifugo:/centrifugo
    command: centrifugo -c config.json
    depends_on:
      - django

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bse-django
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - tarantool
      - redis
    environment:
      - TARANTOOL_HOST=tarantool
      - TARANTOOL_PORT=3301
      - TARANTOOL_USER=admin
      - TARANTOOL_PASSWORD=password
      - REDIS_URL=redis://redis:6379/0
      - CENTRIFUGO_API_URL=http://centrifugo:8000
      - CENTRIFUGO_API_KEY=secret-api-key
      - CENTRIFUGO_HMAC_KEY=secret-hmac-key
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

    # раскоментить снизу если надо будто на проде

    # command:
    #   - sh
    #   - -c
    #   - python manage.py migrate && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 4 --timeout 120 --access-logfile - --error-logfile -

volumes:
  tarantool_data:
  minio_data:
